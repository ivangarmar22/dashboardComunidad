<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Consumo y facturas de electricidad de la comunidad Terrazas del Cañaveral"
    />
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />
    <title>Terrazas del Cañaveral · Electricidad</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Tema guardado aplicado antes de pintar, para evitar un destello
      try {
        const theme = localStorage.getItem('dashboard-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch {
        // Sin acceso a localStorage
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
